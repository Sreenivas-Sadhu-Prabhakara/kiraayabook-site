<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="KiraayaBook — rent that collects itself. A KARYA studio build.">
  <title>KiraayaBook — rent that collects itself</title>

  <!-- ledger paper base -->
  <rect width="1200" height="630" fill="#F6F4EF"/>

  <!-- faint ledger rules -->
  <g stroke="#E1DCCF" stroke-width="2">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="230" x2="1200" y2="230"/>
    <line x1="0" y1="310" x2="1200" y2="310"/>
    <line x1="0" y1="390" x2="1200" y2="390"/>
    <line x1="0" y1="470" x2="1200" y2="470"/>
  </g>

  <!-- teal accent band down the left, like a ledger margin -->
  <rect x="0" y="0" width="18" height="630" fill="#0F766E"/>
  <rect x="90" y="0" width="2" height="630" fill="#DCE8E4"/>

  <!-- logo mark -->
  <g transform="translate(96,74)">
    <rect x="0" y="0" width="72" height="66" rx="8" fill="#0F766E"/>
    <rect x="0" y="0" width="19" height="66" rx="8" fill="#0A5952"/>
    <path d="M32 22h30M32 36h30M32 50h20" stroke="#F6F4EF" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- brand name -->
  <text x="188" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-1">
    <tspan fill="#14201E">Kiraaya</tspan><tspan fill="#0F766E">Book</tspan>
  </text>

  <!-- headline -->
  <text x="96" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-3" fill="#14201E">Rent that</text>
  <text x="96" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-3" fill="#0F766E">collects itself.</text>

  <!-- tagline -->
  <text x="98" y="482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="33" font-weight="500" fill="#43524E">Auto rent cycle, reminders &amp; receipts for landlords &amp; PG owners.</text>

  <!-- footer row: KARYA wordmark + subscription note -->
  <g transform="translate(96,556)">
    <rect x="0" y="-26" width="150" height="42" rx="21" fill="#0F766E"/>
    <text x="75" y="2" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="3" fill="#F6F4EF">KARYA</text>
    <text x="172" y="1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#43524E">studio build · subscription · pricing on discovery</text>
  </g>

  <!-- mini register chip, top-right, echoing the product -->
  <g transform="translate(792,96)">
    <rect x="0" y="0" width="312" height="200" rx="16" fill="#FFFFFF" stroke="#C9D6D0" stroke-width="2"/>
    <text x="24" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#14201E">Rent register</text>
    <rect x="228" y="24" width="64" height="26" rx="13" fill="#DCE8E4"/>
    <text x="260" y="42" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0A5952">Auto</text>

    <text x="24" y="92" font-family="-apple-system, sans-serif" font-size="17" fill="#43524E">Ramesh Iyer</text>
    <rect x="204" y="76" width="88" height="24" rx="12" fill="#0F766E"/>
    <text x="248" y="93" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#F6F4EF">Paid</text>

    <text x="24" y="132" font-family="-apple-system, sans-serif" font-size="17" fill="#43524E">Priya Nair</text>
    <rect x="168" y="116" width="124" height="24" rx="12" fill="#DCE8E4"/>
    <text x="230" y="133" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0A5952">Reminder sent</text>

    <line x1="24" y1="156" x2="288" y2="156" stroke="#E1DCCF" stroke-width="2"/>
    <text x="24" y="182" font-family="-apple-system, sans-serif" font-size="14" fill="#43524E">Collected</text>
    <text x="288" y="182" text-anchor="end" font-family="'SF Mono', Menlo, monospace" font-size="16" font-weight="700" fill="#0F766E">Rs 40,500</text>
  </g>
</svg>
